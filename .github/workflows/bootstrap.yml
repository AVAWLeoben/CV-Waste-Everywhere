ideo\').hidden=mode!==\'camera\';$(\'photo\').hidden=mode!==\'photo\';\n reset();setStatus(source?\'captureReady\':\'stopped\');\n};\n// Explicit media geometry avoids Safari retaining a shrunken video surface after capture.\nfunction previewRect(width,height,frameWidth,frameHeight){\n const scale=Math.max(frameWidth/width,frameHeight/height);\n return {width:width*scale,height:height*scale,left:(frameWidth-width*scale)/2,top:(frameHeight-height*scale)/2};\n}\nfunction fitPreview(){\n if(!source)return;\n const w=source.videoWidth||source.naturalWidth,h=source.videoHeight||source.naturalHeight;\n const frame=$(\'camera\').getBoundingClientRect();if(!w||!h||!frame.width||!frame.height)return;\n const rect=previewRect(w,h,frame.width,frame.height);\n for(const id of [\'video\',\'photo\',\'capture\']){\n  const style=$(id).style;\n  for(const key of [\'width\',\'height\',\'left\',\'top\'])style[key]=`${rect[key]}px`;\n  style.right=\'auto\';style.bottom=\'auto\';\n }\n $(\'reticle\').style.width=`${frame.width*.86}px`;\n $(\'reticle\').style.height=`${frame.height*.8}px`;\n diagnostics.preview={sourceWidth:w,sourceHeight:h,displayWidth:Math.round(rect.width),displayHeight:Math.round(rect.height)};\n}\nfunction refreshPreview(){fitPreview();if(resultSize)draw(item,resultSize.w,resultSize.h);}\nwindow.addEventListener(\'resize\',refreshPreview);\n$(\'video\').addEventListener(\'resize\',refreshPreview);\nif(typeof ResizeObserver!==\'undefined\')new ResizeObserver(refreshPreview).observe($(\'camera\'));\n\ndocument.addEventListener(\'visibilitychange\',()=>{if(document.hidden&&stream)stop();});\nwindow.addEventListener(\'pagehide\',()=>{stop();if(photoURL)URL.revokeObjectURL(photoURL);});\nrender();\n\n// Information dialog\n$(\'infoButton\').onclick=()=>$(\'infoDialog\').showModal();\n$(\'closeInfo\').onclick=()=>$(\'infoDialog\').close();\n', encoding='utf-8')
          Path('web/index.html').write_text('<!doctype html>\n<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f32"><title>Waste Everywhere</title><link rel="stylesheet" href="style.css?v=0.5.0-25.1-4a83187">\n<script type="importmap">{"imports":{"@ultralytics/yolo":"https://esm.sh/@ultralytics/yolo@0.0.55","@litertjs/core":"https://esm.sh/@litertjs/core@2.5.3","@litertjs/wasm-utils":"https://esm.sh/@litertjs/wasm-utils@2.5.3"}}</script></head>\n<body><main><header><b>↻ WASTE EVERYWHERE</b><button id="stop" hidden></button><button id="infoButton" type="button" aria-label="Information">Info</button><button id="language" aria-label="Switch language">EN</button></header><p class="eyebrow" id="eyebrow"></p><h1 id="heading"></h1><p id="intro"></p>\n<section id="camera"><video id="video" playsinline autoplay muted hidden></video><img id="photo" alt="Selected item" hidden><canvas id="capture" hidden></canvas><div id="reticle" aria-hidden="true" hidden></div><canvas id="overlay"></canvas><div id="placeholder">◎</div><span id="privacy"></span></section>\n<button id="start" class="primary"></button><button id="classify" class="primary" hidden>CLASSIFY</button><button id="continue" class="primary" hidden></button><label id="choose" class="choose"><span id="chooseText"></span><input id="image" type="file" accept="image/*"></label><p id="status" role="status" tabindex="0"></p>\n<section class="result" aria-live="polite"><p class="eyebrow" id="resultTitle"></p><h2 id="name" tabindex="0"></h2><h3 id="destination" tabindex="0"></h3><p id="advice" tabindex="0"></p></section><p id="notice"></p>\n\n</main><dialog id="infoDialog"><button id="closeInfo" type="button">Schließen / Close</button><footer><p id="footer"></p><a id="rules" href="https://www.oesterreich.gv.at/de/themen/bauen_und_wohnen/abfall" target="_blank" rel="noopener"></a> · <a href="https://github.com/AVAWLeoben/CV-Waste-Everywhere">Source / Quellcode</a><details><summary>Test details</summary><pre id="diagnostics">{}</pre></details></footer><p id="versionDisclaimer" aria-label="App version" tabindex="0"></p></dialog><script type="module" src="app.js?v=0.5.0-25.1-4a83187"></script></body></html>\n', encoding='utf-8')
          Path('web/style.css').write_text('/* SPDX-License-Identifier: AGPL-3.0-or-later */\n:root{font-family:system-ui,-apple-system,sans-serif;color:#173f32;background:#f6f7f1}*{box-sizing:border-box}body{margin:0}main{height:100vh;height:100svh;height:100dvh;max-width:700px;margin:auto;padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr 1fr;grid-template-rows:44px minmax(0,1fr) auto 44px auto auto;gap:6px}header{grid-area:1/1/2/-1;display:flex;align-items:center;gap:8px;min-width:0}header b{font-size:11px;letter-spacing:.4px;margin-right:auto}button{font:inherit;min-height:44px;cursor:pointer;border:0;border-radius:10px}#language,#infoButton{background:#e1e9db;color:#173f32;padding:0 10px;min-width:44px}#eyebrow,#heading,#intro,#notice{display:none}#camera{grid-area:2/1/3/-1;position:relative;min-height:0;overflow:hidden;border-radius:16px;background:#e2e9dc;display:grid;place-items:center}video,img,canvas{position:absolute;inset:0;width:100%;height:100%}video{object-fit:cover;background:#15281e}img{object-fit:contain;background:#15281e}canvas{pointer-events:none}#placeholder{font-size:64px;color:#8da48e}#privacy{position:absolute;bottom:8px;max-width:95%;background:#f6faefe8;border-radius:24px;padding:5px 9px;font-size:10px;text-align:center}.result{grid-area:3/1/4/-1;padding:9px 12px;border:1px solid #dce5d6;background:white;border-radius:14px;min-width:0}.result .eyebrow{display:none}.result h2{font-size:20px;line-height:1.15;margin:0;overflow-wrap:anywhere}.result h3{font-size:15px;line-height:1.2;margin:5px 0 0;color:#39734e}#advice{font-size:12px;line-height:1.3;margin:5px 0 0;color:#526558}#destination:empty,#advice:empty{display:none}.primary{grid-area:4/1/5/2;width:100%;padding:6px;background:#173f32;color:white;font-size:14px;font-weight:650}button:disabled{opacity:.5}.choose{grid-area:4/2/5/3;display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;border-radius:10px;background:#e1e9db;text-align:center;cursor:pointer}.choose input{position:absolute;width:1px;height:1px;clip-path:inset(50%)}#status{grid-area:5/1/6/-1;margin:0;text-align:center;font-size:11px;line-height:1.2;color:#526558;overflow-wrap:anywhere}#status.error{color:#a43b2a}#versionDisclaimer{grid-area:6/1/7/-1;margin:0;font-size:9px;line-height:1.25;color:#526558;text-align:center;white-space:pre-line;overflow-wrap:anywhere}dialog{max-width:min(94vw,600px);max-height:85dvh;overflow:auto;border:1px solid #dce5d6;border-radius:16px;padding:16px;color:#173f32;background:#f6f7f1}dialog::backdrop{background:#15281e99}dialog footer{font-size:14px;line-height:1.5}dialog button{padding:8px 16px}a{color:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}[hidden]{display:none!important}:focus-visible{outline:3px solid #8abd79;outline-offset:2px}\n@media(max-height:560px){main{gap:4px}.result{padding:7px 10px}.result h2{font-size:18px}#advice{font-size:11px}#privacy{font-size:9px;padding:4px 8px}}\n/* Preserve access with text zoom or very short landscape windows. */\n@media(max-height:420px){main{height:auto;min-height:100dvh;grid-template-rows:44px minmax(140px,1fr) auto 44px auto auto}}\n/* Stable prediction panel: changing text must never resize the camera. */\nmain{grid-template-rows:44px minmax(100px,1fr) 120px 44px 28px 34px}\n.result{height:120px;min-height:0;overflow:hidden;display:grid;grid-template-rows:40px 18px minmax(0,1fr);gap:3px;padding:8px 12px}\n.result #name{font-size:18px;line-height:20px;font-weight:700;letter-spacing:-.02em;margin:0;min-width:0;min-height:0;overflow:auto;overflow-wrap:anywhere}\n.result #destination{display:block;height:18px;font-size:13px;line-height:18px;margin:0;min-height:0;overflow:auto}\n.result #advice{display:block;font-size:12px;line-height:16px;margin:0;min-height:0;overflow:auto;overscroll-behavior:contain}\n#destination:empty,#advice:empty{display:block;visibility:hidden}\n#status{height:28px;min-height:0;overflow:auto;line-height:14px}\n#versionDisclaimer{height:34px;min-height:0;overflow:auto}\n.result,#camera{transition:none}\n@media(max-height:560px){.result{padding:8px 12px}.result #name{font-size:18px}.result #advice{font-size:12px}}\n/* Short landscape windows scroll instead of crushing the camera or clipping text. */\n@media(max-height:480px){main{height:auto;min-height:100dvh;grid-template-rows:44px 140px 120px 44px 28px 34px}}\n/* Camera-first live layout */\nmain{grid-template-rows:44px minmax(100px,1fr) 108px 44px 28px;gap:5px}\n.result{height:108px;grid-template-rows:24px 18px minmax(0,1fr);padding:8px 12px;gap:3px}\n.result #name{font-size:18px;line-height:24px;white-space:nowrap;overflow:auto;overflow-wrap:normal}\n.result #destination{white-space:nowrap;overflow:auto}\n#infoDialog #versionDisclaimer{height:auto;max-height:none;overflow:visible;margin:14px 0 0;font-size:11px;text-align:left}\n#camera{border-radius:12px}\n@media(max-height:480px){main{height:auto;min-height:100dvh;grid-template-rows:44px 140px 108px 44px 28px}}\n\n/* Capture / result flow: reserve a compact, stable result area. */\nmain{grid-template-rows:44px minmax(100px,1fr) 108px 52px 32px}\nvideo,#capture{object-fit:contain;background:#15281e}\n#capture{z-index:1}#overlay{z-index:2}#privacy{z-index:4}\n#reticle{position:absolute;z-index:3;width:68%;height:66%;border:2px solid #ffffffb0;border-radius:24px;box-shadow:0 0 0 1px #0005;pointer-events:none}\n#reticle::after{content:\'+\';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ffffffa0;font-size:24px;font-weight:200}\n#stop{background:transparent;color:#173f32;font-size:11px;padding:0 6px}\n.primary{font-size:16px;letter-spacing:.04em}\n#status{height:32px;line-height:16px}\n.choose.disabled{opacity:.45;pointer-events:none}\nbody[data-phase="processing"] #camera{outline:2px solid #8abd79;outline-offset:-2px}\n@media(max-height:480px){main{height:auto;min-height:100dvh;grid-template-rows:44px 140px 108px 52px 32px}}\n\n/* Stable viewport despite mobile address-bar changes; media never size the grid. */\nmain{height:100svh;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}\n#camera{min-width:0;contain:size layout;isolation:isolate}\n#video,#photo,#capture{object-fit:contain;object-position:center;width:100%;height:100%}\n@media(max-height:480px){main{height:auto;min-height:100svh}}\n', encoding='utf-8')
          Path('scripts/browser_test.mjs').write_text("// SPDX-License-Identifier: AGPL-3.0-or-later\nimport {chromium} from 'playwright';\nimport assert from 'node:assert/strict';\nimport {spawn} from 'node:child_process';\nimport {writeFileSync,readFileSync} from 'node:fs';\nconst server=spawn('python3',['-m','http.server','8000','--bind','127.0.0.1'],{stdio:'ignore'});\nlet browser;\nconst reports=[];\ntry{\n let ready=false;\n for(let n=0;n<40;n++){\n  try{if((await fetch('http://127.0.0.1:8000/site/')).ok){ready=true;break;}}catch{}\n  await new Promise(r=>setTimeout(r,250));\n }\n assert(ready,'Test server did not start');\n browser=await chromium.launch({args:['--enable-unsafe-webgpu','--use-angle=swiftshader']});\n // Exercise the real page styles with long predictions, without downloading a model.\n for(const viewport of [{width:375,height:548},{width:390,height:664},{width:430,height:740}]){\n  const layoutContext=await browser.newContext({viewport});\n  const layoutPage=await layoutContext.newPage();\n  await layoutPage.goto('http://127.0.0.1:8000/site/');\n  for(const language of ['de','en'])for(const active of [false,true]){\n   await layoutPage.evaluate(({language,active})=>{\n    document.documentElement.lang=language;document.body.classList.toggle('scanning',active);\n    document.querySelector('#start').hidden=active;document.querySelector('#stop').hidden=!active;\n    document.querySelector('#name').textContent=language==='de'?'Kunststoff-Getränkeverpackung':'Plastic beverage packaging';\n    document.querySelector('#destination').textContent=language==='de'?'Gelbe Tonne / Gelber Sack':'Yellow bin / yellow bag';\n    document.querySelector('#advice').textContent=language==='de'?'Nur restentleerte Verpackungen. Bei Getränkeflaschen und -dosen zuerst Pfand prüfen.':'Emptied packaging only. Check beverage bottles and cans for a deposit first.';\n    document.querySelector('#status').textContent=language==='de'?'Erkennung wird vorbereitet. Der erste Download kann etwas dauern …':'Preparing recognition. The first download may take a while …';\n   },{language,active});\n   const bounds=await layoutPage.evaluate(()=>({width:innerWidth,height:innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,rects:['camera','name','advice','versionDisclaimer','status',document.querySelector('#start').hidden?'stop':'start'].map(id=>{const r=document.getElementById(id).getBoundingClientRect();return {id,top:r.top,bottom:r.bottom,left:r.left,right:r.right,height:r.height};})}));\n   assert(bounds.scrollWidth<=bounds.width && bounds.scrollHeight<=bounds.height+1,`Page overflow: ${JSON.stringify(bounds)}`);\n   for(const r of bounds.rects)assert(r.top>=0&&r.bottom<=bounds.height+1&&r.left>=0&&r.right<=bounds.width,`Offscreen ${r.id}`);\n   assert(bounds.rects[0].height>=100,'Camera became too small');\n  }\n  const stable=await layoutPage.evaluate(()=>{\n   const ids=['camera','name','destination','advice','start','stop','status','versionDisclaimer'];\n   const geometry=()=>ids.map(id=>{const r=document.getElementById(id).getBoundingClientRect();return [r.x,r.y,r.width,r.height];});\n   const results=[];\n   for(const text of ['', 'Papier', 'Möglicherweise: Leichtverpackung', 'Possible: lightweight packaging with a long description']){\n    for(const id of ['name','destination','advice','status'])document.getElementById(id).textContent=text;\n    results.push(geometry());\n   }\n   return results;\n  });\n  for(const geometry of stable.slice(1))assert.deepEqual(geometry,stable[0],'Prediction text moved the mobile layout');\n  await layoutPage.locator('#infoButton').click();assert(await layoutPage.locator('#infoDialog').isVisible());\n  await layoutPage.locator('#closeInfo').click();assert(!(await layoutPage.locator('#infoDialog').isVisible()));\n  await layoutContext.close();\n }\n const context=await browser.newContext({viewport:{width:390,height:844}});\n const page=await context.newPage();\n await page.addInitScript(()=>{\n  window.requests=[];\n  Object.defineProperty(navigator,'mediaDevices',{value:{getUserMedia:async c=>{\n   window.requests.push(c);throw new DOMException('No rear camera','OverconstrainedError');\n  }}});\n });\n await page.goto('http://127.0.0.1:8000/site/');await page.locator('#start').click();\n await page.waitForFunction(()=>document.querySelector('#status').classList.contains('error'));\n const requests=await page.evaluate(()=>window.requests);\n assert.equal(requests.length,1);assert.deepEqual(requests[0].video.facingMode,{exact:'environment'});\n await page.locator('#language').click();assert.equal(await page.locator('#start').textContent(),'Start rear camera');\n await page.reload();assert.equal(await page.locator('#start').textContent(),'Start rear camera');\n assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));\n await context.close();\n for(const forceCPU of [false,true]){\n  const ctx=await browser.newContext({viewport:{width:390,height:844}});\n  const live=await ctx.newPage();\n  live.on('pageerror',e=>console.error('Page error:',e.stack));\n  live.on('console',m=>{if(m.type()==='error')console.error('Browser:',m.text());});\n  if(forceCPU)await live.addInitScript(()=>Object.defineProperty(navigator,'gpu',{value:undefined}));\n  await live.goto('http://127.0.0.1:8000/site/');\n  const png=await live.evaluate(()=>{const c=document.createElement('canvas');c.width=c.height=640;const g=c.getContext('2d');g.fillStyle='#cedac2';g.fillRect(0,0,640,640);g.fillStyle='#345d47';g.fillRect(220,80,200,480);return c.toDataURL().split(',')[1];});\n  await live.locator('#image').setInputFiles({name:'synthetic-test.png',mimeType:'image/png',buffer:Buffer.from(png,'base64')});\n  await live.locator('#classify').click();\n  let d,success=false;\n  for(let n=0;n<240;n++){\n   d=JSON.parse(await live.locator('#diagnostics').textContent());\n   if(d.error)throw Error(d.error);\n   if(d.completed>0){success=true;break;}\n   await new Promise(r=>setTimeout(r,1000));\n  }\n  assert(success,'Model did not complete browser inference within four minutes');\n  assert.equal(d.mode,'trained');\n  assert.equal(d.inputSize,640);\n  assert.equal(d.model,JSON.parse(readFileSync('site/models/manifest.json')).model);\n  assert(Array.isArray(d.detections));\n  for(const b of d.detections)assert([b.conf,b.x1,b.y1,b.x2,b.y2].every(Number.isFinite));\n  if(forceCPU)assert.equal(d.backend,'cpu');\n  const first=d.completed;\n  await new Promise(r=>setTimeout(r,500));\n  assert.equal(JSON.parse(await live.locator('#diagnostics').textContent()).completed,first,'Unexpected automatic inference');\n  await live.locator('#continue').click();\n  // A different portrait input also exercises letterboxing and stale-output failures.\n  const portrait=await live.evaluate(()=>{const c=document.createElement('canvas');c.width=720;c.height=1280;const g=c.getContext('2d');g.fillStyle='#f5e1be';g.fillRect(0,0,720,1280);g.fillStyle='#903b64';g.fillRect(20,380,670,300);return c.toDataURL().split(',')[1];});\n  await live.locator('#image').setInputFiles({name:'portrait-test.png',mimeType:'image/png',buffer:Buffer.from(portrait,'base64')});\n  await live.locator('#classify').click();\n  await live.waitForFunction(n=>JSON.parse(document.querySelector('#diagnostics').textContent).completed===n,first+1,{timeout:240000});\n  assert(await live.locator('#continue').isVisible(),'Second capture did not finish');\n  d=JSON.parse(await live.locator('#diagnostics').textContent());\n  assert(!d.error,d.error);\n  if(d.backend==='webgpu'){assert.equal(d.gpuChecksPassed,2);assert.equal(d.gpuVerification,'passed');}\n  reports.push({forceCPU,backend:d.backend,fallback:d.fallback,gpuVerification:d.gpuVerification,gpuError:d.gpuError,completed:true,detections:d.detections});\n  await ctx.close();\n }\n const path='site/models/validation.json',report=JSON.parse(readFileSync(path));\n report.browserTested=true;report.browser=reports;writeFileSync(path,JSON.stringify(report,null,2));\n console.log('PASS: rear camera, language, layout, YOLOv8n inference and CPU path.',reports);\n}finally{await browser?.close();server.kill();}\n", encoding='utf-8')
          Path('scripts/capture_state_test.mjs').write_text('import vm from \'node:vm\';\nimport {readFileSync} from \'node:fs\';\nimport assert from \'node:assert/strict\';\nconst elements=new Map();\nconst ctx2d={clearRect(){},drawImage(){},scale(){},strokeRect(){}};\nfunction el(id){if(!elements.has(id))elements.set(id,{hidden:false,disabled:false,style:{},addEventListener(){},textContent:\'\',width:480,height:640,videoWidth:480,videoHeight:640,naturalWidth:480,naturalHeight:640,classList:{toggle(){}},setAttribute(){},getContext:()=>ctx2d,getBoundingClientRect:()=>({width:390,height:420})});return elements.get(id);}\nconst scope=vm.createContext({document:{getElementById:el,body:{dataset:{},classList:{toggle(){}}},documentElement:{},addEventListener(){},hidden:false},window:{addEventListener(){}},localStorage:{getItem(){},setItem(){}},requestAnimationFrame:fn=>setImmediate(fn),performance,devicePixelRatio:1,URL,console});\nvm.runInContext(readFileSync(\'web/app.js\',\'utf8\'),scope);\nvm.runInContext(`config={confidence:.25,classes:[{de:\'Papier\',en:\'Paper\',bin:\'paper\'}]};manifest={mode:\'trained\',model:\'yolo11s.pt\',inputSize:640};source=$(\'video\');mode=\'camera\';phase=\'preview\';globalThis.calls=0;model={device:\'cpu\',predict:async src=>{globalThis.calls++;if(globalThis.fail){globalThis.fail=false;throw Error(\'test error\')}return {width:480,height:640,boxes:[{cls:0,conf:.9,x1:10,y1:10,x2:200,y2:300}]}}};render();`,scope);\nassert.equal(scope.calls,0);\nfor(let n=1;n<=3;n++){\n const promise=el(\'classify\').onclick();await el(\'classify\').onclick();await promise;\n assert.equal(scope.calls,n,\'Double click must not start a second inference\');assert.equal(el(\'name\').textContent,\'Papier\');\n assert.equal(el(\'continue\').hidden,false);assert.equal(el(\'capture\').hidden,false);\n assert.equal(el(\'video\').hidden,false,\'Live video must stay mounted behind the frozen capture\');\n el(\'continue\').onclick();assert.equal(el(\'capture\').hidden,true);assert.equal(el(\'video\').hidden,false);\n}\nscope.fail=true;await el(\'classify\').onclick();assert.equal(el(\'continue\').hidden,false);assert.match(el(\'diagnostics\').textContent,/test error/);\nel(\'continue\').onclick();await el(\'classify\').onclick();assert.equal(scope.calls,5);assert.equal(el(\'name\').textContent,\'Papier\');\nel(\'continue\').onclick();const pending=el(\'classify\').onclick();el(\'stop\').onclick();await pending;\nassert.equal(scope.calls,5,\'Cancelled capture must not run\');assert.equal(el(\'capture\').hidden,true);\nconsole.log(\'PASS: repeated capture, duplicate-click guard, frozen results, error recovery, cancellation before inference\');\n\n// Exercise the actual browser wait predicate with a DOM string property.\nconst browserTest=readFileSync(\'scripts/browser_test.mjs\',\'utf8\');\nconst predicate=browserTest.match(/live\\.waitForFunction\\((n=>.*?),first\\+1,/)[1];\nscope.document.querySelector=()=>({textContent:JSON.stringify({completed:2})});\nassert.equal(vm.runInContext(`(${predicate})(2)`,scope),true);\nassert.equal(vm.runInContext(`(${predicate})(3)`,scope),false);\n// Runtime output order, size, centrality and cross-class overlap must not override confidence.\nvm.runInContext(`source=$(\'video\');mode=\'camera\';phase=\'preview\';config.classes.push({de:\'Restmüll\',en:\'Residual waste\',bin:\'residual\'});model.predict=async()=>({width:480,height:640,boxes:globalThis.testBoxes});`,scope);\nfor(const boxes of [\n [{cls:1,conf:.3,x1:0,y1:0,x2:480,y2:640},{cls:0,conf:.95,x1:5,y1:5,x2:40,y2:60}],\n [{cls:1,conf:.89,x1:10,y1:10,x2:200,y2:300},{cls:0,conf:.92,x1:10,y1:10,x2:200,y2:300}]\n]){\n scope.testBoxes=boxes;await el(\'classify\').onclick();assert.equal(el(\'name\').textContent,\'Papier\');el(\'continue\').onclick();\n}\nscope.testBoxes=[];await el(\'classify\').onclick();assert.equal(el(\'name\').textContent,\'Kein eindeutiger Gegenstand erkannt\');\nconsole.log(\'PASS: actual browser wait predicate, highest con