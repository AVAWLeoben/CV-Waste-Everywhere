name: Waste app - trained YOLO

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Checkpoint path, e.g. models/yolo26n-waste.pt (blank selects the only .pt file)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'models/**.pt'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: waste-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AVAWLeoben/CV-Waste-Everywhere' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Select trained checkpoint
        env:
          REQUESTED_MODEL: ${{ inputs.model_path }}
        shell: python
        run: |
          from pathlib import Path
          import os, hashlib
          root=Path.cwd().resolve();directory=(root/'models').resolve()
          requested=os.environ.get('REQUESTED_MODEL','').strip()
          candidates=sorted(directory.rglob('*.pt'))
          if requested:
              source=(root/requested).resolve()
          else:
              assert len(candidates)==1, 'Keep exactly one .pt in models/, or run manually and specify model_path.'
              source=candidates[0].resolve()
          assert source.is_relative_to(directory) and source.suffix=='.pt' and source.is_file(), 'Model must be a .pt file inside models/'
          relative=source.relative_to(root).as_posix()
          assert '\n' not in relative and '\r' not in relative
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'MODEL_PATH={relative}\nMODEL_SHA256={digest}\n')
          print(f'Selected {relative} ({digest[:12]})')
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the trained-model-compatible classroom loader here only
        shell: python
        run: |
          from pathlib import Path
          Path('scripts/classroom_input.py').write_text(r'''# SPDX-License-Identifier: AGPL-3.0-or-later
          """Give a float32 NHWC TFLite graph the classroom runtime's NCHW input.
          
          Adds one standard TRANSPOSE at the graph entrance. Weights, predictions,
          normalized output coordinates and the fixed YOLOv8n vocabulary stay intact.
          """
          import io
          from pathlib import Path
          import zipfile
          
          import flatbuffers
          import numpy as np
          from ai_edge_litert import schema_py_generated as schema
          
          
          def classroom_input(source, destination):
              data = Path(source).read_bytes()
              root = schema.ModelT.InitFromObj(schema.Model.GetRootAsModel(data, 0))
              assert len(root.subgraphs) == 1, 'Expected one inference graph'
              assert all(not b.offset and not b.size for b in root.buffers), 'External buffers are unsupported'
              graph = root.subgraphs[0]
              assert len(graph.inputs) == 1 and len(graph.outputs) == 1
              old_index = int(graph.inputs[0])
              old = graph.tensors[old_index]
              assert old.type == schema.TensorType.FLOAT32
              shape = list(old.shape)
              if shape == [1, 3, 640, 640]:
                  Path(destination).write_bytes(data)
                  return Path(destination)
              assert shape == [1, 640, 640, 3], f'Unexpected input: {shape}'
          
              input_tensor = schema.TensorT()
              input_tensor.name = b'classroom_images_nchw'
              input_tensor.type = schema.TensorType.FLOAT32
              input_tensor.shape = [1, 3, 640, 640]
              input_tensor.hasRank = True
              new_index = len(graph.tensors)
              graph.tensors.append(input_tensor)
          
              buffer = schema.BufferT()
              buffer.data = np.frombuffer(np.array([0, 2, 3, 1], dtype='<i4').tobytes(), dtype=np.uint8)
              permutation = schema.TensorT()
              permutation.name = b'classroom_nchw_to_nhwc'
              permutation.type = schema.TensorType.INT32
              permutation.shape = [4]
              permutation.hasRank = True
              permutation.buffer = len(root.buffers)
              root.buffers.append(buffer)
              perm_index = len(graph.tensors)
              graph.tensors.append(permutation)
          
              code = schema.OperatorCodeT()
              code.builtinCode = schema.BuiltinOperator.TRANSPOSE
              code.deprecatedBuiltinCode = schema.BuiltinOperator.TRANSPOSE
              code.version = 1
              operator = schema.OperatorT()
              operator.opcodeIndex = len(root.operatorCodes)
              root.operatorCodes.append(code)
              operator.inputs = [new_index, perm_index]
              operator.outputs = [old_index]
              operator.builtinOptionsType = schema.BuiltinOptions.TransposeOptions
              operator.builtinOptions = schema.TransposeOptionsT()
              graph.operators.insert(0, operator)
              graph.inputs = [new_index]
              for signature in root.signatureDefs or []:
                  if signature.subgraphIndex == 0:
                      for item in signature.inputs:
                          if item.tensorIndex == old_index:
                              item.tensorIndex = new_index
          
              builder = flatbuffers.Builder(len(data))
              builder.Finish(root.Pack(builder), file_identifier=b'TFL3')
              result = io.BytesIO(bytes(builder.Output()))
              # The classroom loader obtains the class names from this ZIP attachment.
              with zipfile.ZipFile(io.BytesIO(data)) as original, zipfile.ZipFile(result, 'a') as updated:
                  for info in original.infolist():
                      updated.writestr(info, original.read(info.filename))
              Path(destination).write_bytes(result.getvalue())
              return Path(destination)
          ''')
          Path('scripts/export_model.py').write_text(r'''# SPDX-License-Identifier: AGPL-3.0-or-later
          """Export in a child process; publish only after TFLite numerical checks pass."""
          import argparse, json, os, subprocess, sys
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          p=argparse.ArgumentParser();p.add_argument('--candidate',choices=['trained']);p.add_argument('--choice',choices=['trained'],default='trained');a=p.parse_args()
          (ROOT/'model-work').mkdir(exist_ok=True);out=ROOT/'build/models';out.mkdir(parents=True,exist_ok=True)
          if not a.candidate:
              for mode in ['trained']:
                  log=ROOT/'model-work'/f'{mode}.log'
                  print(f'Attempting {mode}',flush=True)
                  with log.open('w') as f:
                      try: ok=subprocess.run([sys.executable,__file__,'--candidate',mode],stdout=f,stderr=subprocess.STDOUT,timeout=1500).returncode==0
                      except subprocess.TimeoutExpired: ok=False
                  print(log.read_text()[-18000:],flush=True)
                  if ok:
                      summary=os.environ.get('GITHUB_STEP_SUMMARY')
                      if summary:
                          with open(summary,'a') as f:f.write(f'## Model\nSelected: **{mode}**. Conversion checks passed.\n')
                      sys.exit(0)
              sys.exit('No candidate passed export and numerical checks; nothing will deploy.')
          
          import copy,hashlib,shutil,zipfile
          import numpy as np
          import torch
          from ultralytics import YOLO
          from classroom_input import classroom_input
          from ai_edge_litert.interpreter import Interpreter
          os.chdir(ROOT/'model-work');torch.set_num_threads(2)
          config=json.loads((ROOT/'web/config.json').read_text());prompts=[c['prompt'] for c in config['classes']]
          source=ROOT/os.environ['MODEL_PATH']
          checkpoint=source.name
          assert source.is_file(), f'Missing trained model: {source}'
          source_hash=hashlib.sha256(source.read_bytes()).hexdigest()
          model=YOLO(str(source))
          assert model.task=='detect', 'Expected a detection checkpoint'
          assert [model.names[k] for k in range(len(model.names))]==prompts, 'Checkpoint class order differs from config'
          architecture=Path(str(model.model.yaml.get('yaml_file',''))).stem or 'Custom YOLO detector'
          scale=str(model.model.yaml.get('scale',''))
          if scale and not architecture.endswith(scale): architecture+=' ('+scale+')'
          end2end=bool(getattr(model.model,'end2end',False))
          reference=copy.deepcopy(model.model).eval().float()
          export=Path(model.export(format='tflite',imgsz=640,batch=1,half=False,int8=False,nms=False,end2end=end2end,device='cpu',opset=17))
          file=export if export.is_file() else next(export.glob('*_float32.tflite'))
          file=classroom_input(file,file.with_name('trained_classroom.tflite'))
          i=Interpreter(model_path=str(file),num_threads=2);i.allocate_tensors()
          inputs=i.get_input_details();outputs=i.get_output_details()
          assert len(inputs)==len(outputs)==1
          assert list(inputs[0]['shape'])==[1,3,640,640]
          assert inputs[0]['dtype']==outputs[0]['dtype']==np.float32
          ops=sorted({x['op_name'] for x in i._get_ops_details()})
          assert not any(x.startswith('Flex') or x=='CUSTOM' for x in ops),'Custom/Flex operations cannot be shipped'
          def compare_outputs(actual,expected,end2end,nc):
              assert np.isfinite(actual).all() and np.isfinite(expected).all(), 'Non-finite predictions'
              actual=actual.copy()
              if end2end:
                  assert actual.ndim==expected.ndim==3 and actual.shape==expected.shape and actual.shape[0]==1 and actual.shape[2]==6, f'Expected matching [1,N,6], got {actual.shape}, {expected.shape}'
                  # Only xyxy coordinates are normalized; confidence and class IDs are not.
                  actual[...,:4]*=640
                  a,e=actual[0],expected[0]
                  for rows in (a,e):
                      assert ((rows[:,4]>=0)&(rows[:,4]<=1)).all(), 'Invalid confidence'
                      assert ((rows[:,5]>=0)&(rows[:,5]<nc)).all(), 'Invalid class ID'
                      np.testing.assert_allclose(rows[:,5],np.rint(rows[:,5]),rtol=0,atol=1e-6)
                  # Top-k ordering can change across runtimes. Match within class using box and score error.
                  from scipy.optimize import linear_sum_assignment
                  box_cost=np.max(np.abs(a[:,None,:4]-e[None,:,:4])/(.25+.003*np.abs(e[None,:,:4])),axis=2)
                  score_cost=np.abs(a[:,None,4]-e[None,:,4])/(.002+.005*np.abs(e[None,:,4]))
                  cost=box_cost+score_cost+(a[:,None,5]!=e[None,:,5])*1e9
                  ai,ei=linear_sum_assignment(cost)
                  a,e=a[ai],e[ei]
                  np.testing.assert_array_equal(a[:,5],e[:,5])
                  ab,eb,asc,esc=a[:,:4],e[:,:4],a[:,4],e[:,4]
              else:
                  if actual.shape!=expected.shape and actual.ndim==3 and actual.transpose(0,2,1).shape==expected.shape:
                      actual=actual.transpose(0,2,1)
                  assert actual.shape==expected.shape and expected.ndim==3 and expected.shape[1]==4+nc, f'Expected raw [1,{4+nc},N], got {actual.shape}, {expected.shape}'
                  actual[:,:4,:]*=640
                  ab,eb,asc,esc=actual[:,:4,:],expected[:,:4,:],actual[:,4:,:],expected[:,4:,:]
              np.testing.assert_allclose(ab,eb,rtol=.003,atol=.25)
              np.testing.assert_allclose(asc,esc,rtol=.005,atol=.002)
              return {'maxBoxErrorPixels':float(np.max(np.abs(ab-eb),initial=0)), 'maxScoreError':float(np.max(np.abs(asc-esc),initial=0)), 'end2end':end2end}
          rng=np.random.default_rng(42);checks=[]
          xs=[np.zeros((1,640,640,3),np.float32),rng.random((1,640,640,3),dtype=np.float32),np.tile(np.linspace(0,1,640,dtype=np.float32)[None,None,:,None],(1,640,1,3))]
          for x in xs:
              with torch.inference_mode():
                  y=reference(torch.from_numpy(x.transpose(0,3,1,2).copy()))
                  expected=(y[0] if isinstance(y,tuple) else y).numpy()
              i.set_tensor(inputs[0]['index'],x.transpose(0,3,1,2).copy());i.invoke();actual=i.get_tensor(outputs[0]['index'])
              checks.append(compare_outputs(actual,expected,end2end,len(prompts)))
          with zipfile.ZipFile(file) as z: metadata=json.loads(z.read('metadata.json'))
          assert metadata['task']=='detect'
          assert bool(metadata.get('end2end',False))==end2end, 'Export metadata lost end-to-end mode'
          assert metadata['imgsz']==[640,640]
          names=prompts
          assert [metadata['names'][str(k)] for k in range(len(names))]==names
          shutil.copyfile(file,out/'waste_640.tflite')
          manifest={'file':'waste_640.tflite','mode':'trained','pipeline':'classroom','inputSize':640,'model':checkpoint,'architecture':architecture,'end2end':end2end,'outputLayout':'xyxy-score-class' if end2end else 'xywh-class-scores','checkpointSha256':source_hash,'prompts':prompts,'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),'build':os.environ.get('GITHUB_SHA','local')}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (out/'validation.json').write_text(json.dumps({'checks':checks,'ops':ops,'input':inputs[0]['shape'].tolist(),'output':outputs[0]['shape'].tolist(),'mobileTested':False},indent=2))
          print(json.dumps(manifest,indent=2))
          ''')
          Path('scripts/requirements.txt').write_text(r'''ultralytics==8.4.16
          numpy==1.26.4
          scipy==1.14.1
          onnx==1.17.0
          onnxruntime==1.20.1
          tensorflow==2.19.0
          tf-keras==2.19.0
          onnx2tf==1.26.3
          onnx-graphsurgeon==0.5.8
          sng4onnx==1.0.4
          onnxslim==0.1.71
          ai-edge-litert==1.4.0
          protobuf==5.29.5
          ftfy==6.3.1
          regex==2024.11.6
          tqdm==4.67.1
          ''')
          Path('README-WASTE.md').write_text(r'''# Waste Everywhere — trained YOLO
          Keep one trained .pt checkpoint in models/, or select model_path when running manually. Architecture changes must pass export and browser checks.
          The six trained class IDs are Papier, Leichtverpackung, Buntglas, Weißglas, Biotonne, Restmüll.
          Class names are validated against the checkpoint before float32 TFLite export at 640 pixels.
          Numerical equivalence and real browser inference checks must pass before Pages deployment.
          The checkpoint hash participates in the export cache key. Camera images remain on device.
          Browser checks establish execution, not sorting accuracy or physical phone performance.
          ''')
      - name: Install capture UI and regression checks
        shell: python
        run: |
          from pathlib import Path
          Path('web/app.js').write_text('// SPDX-License-Identifier: AGPL-3.0-or-later\nconst $=id=>document.getElementById(id);\nconst words={\n de:{eyebrow:\'WENIGER RÄTSELN. BESSER TRENNEN.\',heading:\'Zeig uns, was du entsorgen möchtest.\',intro:\'Ein Gegenstand. Deine Rückkamera. Eine erste Orientierung.\',privacy:\'● Bleibt auf deinem Gerät\',start:\'Rückkamera starten\',stop:\'Kamera stoppen\',chooseText:\'Foto wählen\',resultTitle:\'DEINE SORTIERHILFE\',ready:\'Bereit, wenn du es bist.\',search:\'Gegenstand ins Bild halten\',steady:\'Kurz ruhig halten …\',uncertain:\'Noch nicht eindeutig\',loading:\'Erkennung wird vorbereitet. Der erste Download kann etwas dauern …\',active:\'Erkennung läuft lokal auf deinem Gerät.\',stopped:\'Kamera gestoppt.\',cameraError:\'Rückkamera nicht verfügbar. Kamerazugriff in Safari erlauben oder ein Foto auswählen.\',modelError:\'Erkennung konnte nicht geladen werden. Bitte erneut versuchen.\',imageError:\'Foto konnte nicht geöffnet werden.\',inferError:\'Erkennung unterbrochen. Bitte neu starten.\',generic:\'Objekt erkannt. Dieses Testmodell bestimmt noch keine passende Sammlung.\',trained:\'Experimentelle Erkennung. Empfehlung und Ausnahmen bitte prüfen.\',standin:\'Testmodus: allgemeines YOLO-Modell. Objekterkennung ohne Entsorgungsempfehlung.\',footer:\'Prototyp für Österreich. Bilder werden nicht hochgeladen oder gesammelt. Unsichere Ergebnisse sind keine Entsorgungsempfehlung.\',rules:\'Offizielle Informationen zur Mülltrennung ↗\'},\n en:{eyebrow:\'LESS GUESSING. BETTER SORTING.\',heading:\'Show us what you want to throw away.\',intro:\'One item. Your rear camera. A little guidance.\',privacy:\'● Stays on your device\',start:\'Start rear camera\',stop:\'Stop camera\',chooseText:\'Choose photo\',resultTitle:\'YOUR SORTING GUIDE\',ready:\'Ready when you are.\',search:\'Hold one item in view\',steady:\'Hold still for a moment …\',uncertain:\'Not clear yet\',loading:\'Preparing recognition. The first download may take a while …\',active:\'Recognition is running locally on your device.\',stopped:\'Camera stopped.\',cameraError:\'Rear camera unavailable. Allow camera access in Safari or choose a photo.\',modelError:\'Could not load recognition. Please try again.\',imageError:\'Could not open this photo.\',inferError:\'Recognition interrupted. Please restart.\',generic:\'Object detected. This test model does not determine its collection stream yet.\',trained:\'Experimental recognition. Check the suggestion and exceptions.\',standin:\'Test mode: general YOLO model. Object recognition without disposal advice.\',footer:\'Prototype for Austria. Images are not uploaded or collected. Uncertain results are not disposal advice.\',rules:\'Official waste-sorting information ↗\'}\n};\nconst bins={\n residual:{de:[\'Restmüll\',\'Nur nicht verwertbarer Haushaltsabfall. Keine Batterien, Elektrogeräte oder Problemstoffe.\'],en:[\'Residual waste\',\'Non-recyclable household waste only. No batteries, electronics or hazardous waste.\']},\n yellow:{de:[\'Gelbe Tonne / Gelber Sack\',\'Nur restentleerte Verpackungen. Bei Getränkeflaschen und -dosen zuerst Pfand prüfen.\'],en:[\'Yellow bin / yellow bag\',\'Emptied packaging only. Check beverage bottles and cans for a deposit first.\']},\n deposit:{de:[\'Zuerst Pfand prüfen\',\'Mit österreichischem Pfandzeichen: leer und unzerdrückt zurückgeben. Ohne Zeichen: Verpackungssammlung prüfen.\'],en:[\'Check the deposit first\',\'With the Austrian deposit mark: return empty and uncrushed. Otherwise check packaging collection rules.\']},\n clear:{de:[\'Weißglas – sofern kein Mehrweg\',\'Nur restentleerte, farblose Glasverpackungen. Mehrwegflaschen zurückgeben. Keine Trinkgläser.\'],en:[\'Clear glass – unless returnable\',\'Emptied, colourless glass packaging only. Return reusable bottles. No drinking glasses.\']},\n colored:{de:[\'Buntglas – sofern kein Mehrweg\',\'Nur restentleerte, farbige Glasverpackungen. Mehrwegflaschen zurückgeben. Keine Trinkgläser.\'],en:[\'Colou