name: Waste app - YOLOv8n

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waste-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AVAWLeoben/CV-Waste-Everywhere' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the trained-model-compatible classroom loader here only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("web/app.js")
          s=p.read_text()
          markers=["// Classroom model loading:", "// Compatibility adapter", "async function ensureModel(){"]
          start=next(s.index(m) for m in markers if m in s)
          end=s.index("function stop(){",start)
          loader=r'''// Classroom model loading: same YOLO.load(File) / predict(image) API as DSL.
          // Keep the JavaScript import map and the WebAssembly assets on 2.5.3.
          let cpuOnly=false;
          async function ensureModel(){
           if(model)return model;if(loading)return loading;
           loading=(async()=>{
            setStatus('loading');
            [config,manifest]=await Promise.all([json('./config.json'),json('./models/manifest.json')]);
            if(manifest.pipeline!=='classroom'||manifest.mode!=='trained'||manifest.model!=='waste_yolov8n.pt')throw Error('Expected the YOLOv8n classroom-compatible export');
            if(JSON.stringify(manifest.prompts)!==JSON.stringify(config.classes.map(c=>c.prompt)))throw Error('Model vocabulary mismatch');
            diagnostics.model=manifest.model;diagnostics.mode=manifest.mode;diagnostics.inputSize=manifest.inputSize;render();
            const {YOLO}=await import('@ultralytics/yolo');
            const response=await fetch(new URL('./models/'+manifest.file,location.href));
            if(!response.ok)throw Error(`Model HTTP ${response.status}`);
            const file=new File([await response.blob()],manifest.file,{type:'application/octet-stream'});
            model=await YOLO.load(file,{
             device:cpuOnly?'cpu':'webgpu',
             litertWasmUrl:'https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/wasm/'
            });
            return model;
           })();
           try{return await loading;}finally{loading=null;}
          }
          async function predictWithFallback(src,options){
           try{return await model.predict(src,options);}
           catch(e){
            if(cpuOnly||model?.device!=='webgpu')throw e;
            // A GPU can compile successfully and still fail when invoking the model.
            // Retry the entire model on CPU once, using the public loader API.
            cpuOnly=true;diagnostics.fallback='cpu';diagnostics.gpuError=String(e.message||e);
            const failed=model;model=null;
            try{failed.free();}catch{}
            await ensureModel();
            const result=await model.predict(src,options);
            return result;
           }
          }
          '''
          s=s[:start]+loader+s[end:]
          s=s.replace("r=await model.predict(src,{", "r=await predictWithFallback(src,{")
          line=" diagnostics.detections=boxes.map(({cls,name,conf,x1,y1,x2,y2})=>({cls,name,conf,x1,y1,x2,y2}));\n"
          if line not in s:
              assert " const rank=b=>" in s
              s=s.replace(" const rank=b=>",line+" const rank=b=>")
          s=s.replace("if(token!==epoch)return;diagnostics.inferenceMs", "if(token!==epoch)return;status='active';diagnostics.inferenceMs")
          assert "adaptTensorFlowModel" not in s
          p.write_text(s)
          p=Path("web/index.html")
          s=p.read_text()
          imports='<script type="importmap">{"imports":{"@ultralytics/yolo":"https://esm.sh/@ultralytics/yolo@0.0.49","@litertjs/core":"https://esm.sh/@litertjs/core@2.5.3","@litertjs/wasm-utils":"https://esm.sh/@litertjs/wasm-utils@2.5.3"}}</script>'
          s,count=re.subn(r'<script type="importmap">.*?</script>',lambda m:imports,s,flags=re.S)
          assert count==1
          p.write_text(s)
          Path('scripts/classroom_input.py').write_text(r'''# SPDX-License-Identifier: AGPL-3.0-or-later
          """Give a float32 NHWC TFLite graph the classroom runtime's NCHW input.
          
          Adds one standard TRANSPOSE at the graph entrance. Weights, predictions,
          normalized output coordinates and the fixed YOLOv8n vocabulary stay intact.
          """
          import io
          from pathlib import Path
          import zipfile
          
          import flatbuffers
          import numpy as np
          from ai_edge_litert import schema_py_generated as schema
          
          
          def classroom_input(source, destination):
              data = Path(source).read_bytes()
              root = schema.ModelT.InitFromObj(schema.Model.GetRootAsModel(data, 0))
              assert len(root.subgraphs) == 1, 'Expected one inference graph'
              assert all(not b.offset and not b.size for b in root.buffers), 'External buffers are unsupported'
              graph = root.subgraphs[0]
              assert len(graph.inputs) == 1 and len(graph.outputs) == 1
              old_index = int(graph.inputs[0])
              old = graph.tensors[old_index]
              assert old.type == schema.TensorType.FLOAT32
              shape = list(old.shape)
              if shape == [1, 3, 640, 640]:
                  Path(destination).write_bytes(data)
                  return Path(destination)
              assert shape == [1, 640, 640, 3], f'Unexpected input: {shape}'
          
              input_tensor = schema.TensorT()
              input_tensor.name = b'classroom_images_nchw'
              input_tensor.type = schema.TensorType.FLOAT32
              input_tensor.shape = [1, 3, 640, 640]
              input_tensor.hasRank = True
              new_index = len(graph.tensors)
              graph.tensors.append(input_tensor)
          
              buffer = schema.BufferT()
              buffer.data = np.frombuffer(np.array([0, 2, 3, 1], dtype='<i4').tobytes(), dtype=np.uint8)
              permutation = schema.TensorT()
              permutation.name = b'classroom_nchw_to_nhwc'
              permutation.type = schema.TensorType.INT32
              permutation.shape = [4]
              permutation.hasRank = True
              permutation.buffer = len(root.buffers)
              root.buffers.append(buffer)
              perm_index = len(graph.tensors)
              graph.tensors.append(permutation)
          
              code = schema.OperatorCodeT()
              code.builtinCode = schema.BuiltinOperator.TRANSPOSE
              code.deprecatedBuiltinCode = schema.BuiltinOperator.TRANSPOSE
              code.version = 1
              operator = schema.OperatorT()
              operator.opcodeIndex = len(root.operatorCodes)
              root.operatorCodes.append(code)
              operator.inputs = [new_index, perm_index]
              operator.outputs = [old_index]
              operator.builtinOptionsType = schema.BuiltinOptions.TransposeOptions
              operator.builtinOptions = schema.TransposeOptionsT()
              graph.operators.insert(0, operator)
              graph.inputs = [new_index]
              for signature in root.signatureDefs or []:
                  if signature.subgraphIndex == 0:
                      for item in signature.inputs:
                          if item.tensorIndex == old_index:
                              item.tensorIndex = new_index
          
              builder = flatbuffers.Builder(len(data))
              builder.Finish(root.Pack(builder), file_identifier=b'TFL3')
              result = io.BytesIO(bytes(builder.Output()))
              # The classroom loader obtains the class names from this ZIP attachment.
              with zipfile.ZipFile(io.BytesIO(data)) as original, zipfile.ZipFile(result, 'a') as updated:
                  for info in original.infolist():
                      updated.writestr(info, original.read(info.filename))
              Path(destination).write_bytes(result.getvalue())
              return Path(destination)
          ''')
          Path('scripts/export_model.py').write_text(r'''# SPDX-License-Identifier: AGPL-3.0-or-later
          """Export in a child process; publish only after TFLite numerical checks pass."""
          import argparse, json, os, subprocess, sys
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          p=argparse.ArgumentParser();p.add_argument('--candidate',choices=['trained']);p.add_argument('--choice',choices=['trained'],default='trained');a=p.parse_args()
          (ROOT/'model-work').mkdir(exist_ok=True);out=ROOT/'build/models';out.mkdir(parents=True,exist_ok=True)
          if not a.candidate:
              for mode in ['trained']:
                  log=ROOT/'model-work'/f'{mode}.log'
                  print(f'Attempting {mode}',flush=True)
                  with log.open('w') as f:
                      try: ok=subprocess.run([sys.executable,__file__,'--candidate',mode],stdout=f,stderr=subprocess.STDOUT,timeout=1500).returncode==0
                      except subprocess.TimeoutExpired: ok=False
                  print(log.read_text()[-18000:],flush=True)
                  if ok:
                      summary=os.environ.get('GITHUB_STEP_SUMMARY')
                      if summary:
                          with open(summary,'a') as f:f.write(f'## Model\nSelected: **{mode}**. Conversion checks passed.\n')
                      sys.exit(0)
              sys.exit('No candidate passed export and numerical checks; nothing will deploy.')
          
          import copy,hashlib,shutil,zipfile
          import numpy as np
          import torch
          from ultralytics import YOLO
          from classroom_input import classroom_input
          from ai_edge_litert.interpreter import Interpreter
          os.chdir(ROOT/'model-work');torch.set_num_threads(2)
          config=json.loads((ROOT/'web/config.json').read_text());prompts=[c['prompt'] for c in config['classes']]
          checkpoint='waste_yolov8n.pt'
          source=ROOT/'models'/checkpoint
          assert source.is_file(), f'Missing trained model: {source}'
          source_hash=hashlib.sha256(source.read_bytes()).hexdigest()
          model=YOLO(str(source))
          assert model.task=='detect', 'Expected a detection checkpoint'
          assert [model.names[k] for k in range(len(model.names))]==prompts, 'Checkpoint class order differs from config'
          reference=copy.deepcopy(model.model).eval().float()
          export=Path(model.export(format='tflite',imgsz=640,batch=1,half=False,int8=False,nms=False,device='cpu',opset=17))
          file=export if export.is_file() else next(export.glob('*_float32.tflite'))
          file=classroom_input(file,file.with_name('trained_classroom.tflite'))
          i=Interpreter(model_path=str(file),num_threads=2);i.allocate_tensors()
          inputs=i.get_input_details();outputs=i.get_output_details()
          assert len(inputs)==len(outputs)==1
          assert list(inputs[0]['shape'])==[1,3,640,640]
          assert inputs[0]['dtype']==outputs[0]['dtype']==np.float32
          ops=sorted({x['op_name'] for x in i._get_ops_details()})
          assert not any(x.startswith('Flex') or x=='CUSTOM' for x in ops),'Custom/Flex operations cannot be shipped'
          rng=np.random.default_rng(42);checks=[]
          xs=[np.zeros((1,640,640,3),np.float32),rng.random((1,640,640,3),dtype=np.float32),np.tile(np.linspace(0,1,640,dtype=np.float32)[None,None,:,None],(1,640,1,3))]
          for x in xs:
              with torch.inference_mode():
                  y=reference(torch.from_numpy(x.transpose(0,3,1,2).copy()))
                  expected=(y[0] if isinstance(y,tuple) else y).numpy()
              i.set_tensor(inputs[0]['index'],x.transpose(0,3,1,2).copy());i.invoke();actual=i.get_tensor(outputs[0]['index'])
              if actual.shape!=expected.shape and actual.transpose(0,2,1).shape==expected.shape:actual=actual.transpose(0,2,1)
              assert actual.shape==expected.shape and np.isfinite(actual).all()
              # Ultralytics TFLite exports normalize decoded coordinates to input size.
              actual=actual.copy();actual[:,:4,:]*=640
              np.testing.assert_allclose(actual[:,:4,:],expected[:,:4,:],rtol=.003,atol=.25)
              np.testing.assert_allclose(actual[:,4:,:],expected[:,4:,:],rtol=.005,atol=.002)
              checks.append({'maxBoxErrorPixels':float(abs(actual[:,:4,:]-expected[:,:4,:]).max()),'maxScoreError':float(abs(actual[:,4:,:]-expected[:,4:,:]).max())})
          with zipfile.ZipFile(file) as z: metadata=json.loads(z.read('metadata.json'))
          assert metadata['task']=='detect'
          assert metadata['imgsz']==[640,640]
          names=prompts
          assert [metadata['names'][str(k)] for k in range(len(names))]==names
          shutil.copyfile(file,out/'waste_640.tflite')
          manifest={'file':'waste_640.tflite','mode':'trained','pipeline':'classroom','inputSize':640,'model':checkpoint,'checkpointSha256':source_hash,'prompts':prompts,'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),'build':os.environ.get('GITHUB_SHA','local')}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (out/'validation.json').write_text(json.dumps({'checks':checks,'ops':ops,'input':inputs[0]['shape'].tolist(),'output':outputs[0]['shape'].tolist(),'mobileTested':False},indent=2))
          print(json.dumps(manifest,indent=2))
          ''')
          Path('scripts/requirements.txt').write_text(r'''ultralytics==8.4.16
          numpy==1.26.4
          onnx==1.17.0
          onnxruntime==1.20.1
          tensorflow==2.19.0
          tf-keras==2.19.0
          onnx2tf==1.26.3
          onnx-graphsurgeon==0.5.8
          sng4onnx==1.0.4
          onnxslim==0.1.71
          ai-edge-litert==1.4.0
          protobuf==5.29.5
          ftfy==6.3.1
          regex==2024.11.6
          tqdm==4.67.1
          ''')
          Path('scripts/browser_test.mjs').write_text(r'''// SPDX-License-Identifier: AGPL-3.0-or-later
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {writeFileSync,readFileSync} from 'node:fs';
          const server=spawn('python3',['-m','http.server','8000','--bind','127.0.0.1'],{stdio:'ignore'});
          let browser;
          const reports=[];
          try{
           let ready=false;
           for(let n=0;n<40;n++){
            try{if((await fetch('http://127.0.0.1:8000/site/')).ok){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,250));
           }
           assert(ready,'Test server did not start');
           browser=await chromium.launch({args:['--enable-unsafe-webgpu','--use-angle=swiftshader']});
           // Exercise the real page styles with long predictions, without downloading a model.
           for(const viewport of [{width:375,height:548},{width:390,height:664},{width:430,height:740}]){
            const layoutContext=await browser.newContext({viewport});
            const layoutPage=await layoutContext.newPage();
            await layoutPage.goto('http://127.0.0.1:8000/site/');
            for(const language of ['de','en'])for(const active of [false,true]){
             await layoutPage.evaluate(({language,active})=>{
              document.documentElement.lang=language;document.body.classList.toggle('scanning',active);
              document.querySelector('#start').hidden=active;document.querySelector('#stop').hidden=!active;
              document.querySelector('#name').textContent=language==='de'?'Kunststoff-Getränkeverpackung':'Plastic beverage packaging';
              document.querySelector('#destination').textContent=language==='de'?'Gelbe Tonne / Gelber Sack':'Yellow bin / yellow bag';
              document.querySelector('#advice').textContent=language==='de'?'Nur restentleerte Verpackungen. Bei Getränkeflaschen und -dosen zuerst Pfand prüfen.':'Emptied packaging only. Check beverage bottles and cans for a deposit first.';
              document.querySelector('#status').textContent=language==='de'?'Erkennung wird vorbereitet. Der erste Download kann etwas dauern …':'Preparing recognition. The first download may take a while …';
             },{language,active});
             const bounds=await layoutPage.evaluate(()=>({width:innerWidth,height:innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,rects:['camera','name','advice','versionDisclaimer','status',document.querySelector('#start').hidden?'stop':'start'].map(id=>{const r=document.getElementById(id).getBoundingClientRect();return {id,top:r.top,bottom:r.bottom,left:r.left,right:r.right,height:r.height};})}));
             assert(bounds.scrollWidth<=bounds.width && bounds.scrollHeight<=bounds.height+1,`Page overflow: ${JSON.stringify(bounds)}`);
             for(const r of bounds.rects)assert(r.top>=0&&r.bottom<=bounds.height+1&&r.left>=0&&r.right<=bounds.width,`Offscreen ${r.id}`);
             assert(bounds.rects[0].height>=100,'Camera became too small');
            }
            await layoutPage.locator('#infoButton').click();assert(await layoutPage.locator('#infoDialog').isVisible());
            await layoutPage.locator('#closeInfo').click();assert(!(await layoutPage.locator('#infoDialog').isVisible()));
            await layoutContext.close();
           }
           const context=await browser.newContext({viewport:{width:390,height:844}});
           const page=await context.newPage();
           await page.addInitScript(()=>{
            window.requests=[];
            Object.defineProperty(navigator,'mediaDevices',{value:{getUserMedia:async c=>{
             window.requests.push(c);throw new DOMException('No rear camera','OverconstrainedError');
            }}});
           });
           await page.goto('http://127.0.0.1:8000/site/');await page.locator('#start').click();
           await page.waitForFunction(()=>document.querySelector('#status').classList.contains('error'));
           const requests=await page.evaluate(()=>window.requests);
           assert.equal(requests.length,1);assert.deepEqual(requests[0].video.facingMode,{exact:'environment'});
           await page.locator('#language').click();assert.equal(await page.locator('#start').textContent(),'Start rear camera');
           await page.reload();assert.equal(await page.locator('#start').textContent(),'Start rear camera');
           assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
           await context.close();
           for(const forceCPU of [false,true]){
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            const live=await ctx.newPage();
            live.on('pageerror',e=>console.error('Page error:',e.stack));
            live.on('console',m=>{if(m.type()==='error')console.error('Browser:',m.text());});
            if(forceCPU)await live.addInitScript(()=>Object.defineProperty(navigator,'gpu',{value:undefined}));
            await live.goto('http://127.0.0.1:8000/site/');
            const png=await live.evaluate(()=>{const c=document.createElement('canvas');c.width=c.height=640;const g=c.getContext('2d');g.fillStyle='#cedac2';g.fillRect(0,0,640,640);g.fillStyle='#345d47';g.fillRect(220,80,200,480);return c.toDataURL().split(',')[1];});
            await live.locator('#image').setInputFiles({name:'synthetic-test.png',mimeType:'image/png',buffer:Buffer.from(png,'base64')});
            let d,success=false;
            for(let n=0;n<240;n++){
             d=JSON.parse(await live.locator('#diagnostics').textContent());
             if(d.error)throw Error(d.error);
             if(d.completed>0){success=true;break;}
             await new Promise(r=>setTimeout(r,1000));
            }
            assert(success,'Model did not complete browser inference within four minutes');
            assert.equal(d.mode,'trained');
            assert.equal(d.inputSize,640);
            assert.equal(d.model,'waste_yolov8n.pt');
            assert(Array.isArray(d.detections));
            for(const b of d.detections)assert([b.conf,b.x1,b.y1,b.x2,b.y2].every(Number.isFinite));
            if(forceCPU)assert.equal(d.backend,'cpu');
            reports.push({forceCPU,backend:d.backend,fallback:d.fallback,completed:true,detections:d.detections});
            await ctx.close();
           }
           const path='site/models/validation.json',report=JSON.parse(readFileSync(path));
           report.browserTested=true;report.browser=reports;writeFileSync(path,JSON.stringify(report,null,2));
           console.log('PASS: rear camera, language, layout, YOLOv8n inference and CPU path.',reports);
          }finally{await browser?.close();server.kill();}
          ''')
          Path('README-WASTE.md').write_text(r'''# Waste Everywhere — trained YOLOv8n
          Commit your trained detection checkpoint to models/waste_yolov8n.pt and run this workflow on main.
          The six trained class IDs are Papier, Leichtverpackung, Buntglas, Weißglas, Biotonne, Restmüll.
          Class names are validated against the checkpoint before float32 TFLite export at 640 pixels.
          Numerical equivalence and real browser inference checks must pass before Pages deployment.
          The checkpoint hash participates in the export cache key. Camera images remain on device.
          Browser checks establish execution, not sorting accuracy or physical phone performance.
          ''')
      - name: Make camera and prediction fit one screen
        shell: python
        run: |
          from pathlib import Path
          p=Path('web/style.css')
          css=p.read_text().split('/* Mobile scanning view */')[0]
          css+='''/* Mobile scanning view */
          body.scanning main{height:100svh;max-width:700px;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;grid-template-rows:42px minmax(140px,1fr) auto 48px auto;gap:8px}
          body.scanning header{grid-column:1/-1;grid-row:1;margin:0}
          body.scanning #eyebrow,body.scanning h1,body.scanning #intro,body.scanning #notice,body.scanning footer{display:none}
          body.scanning #camera{grid-column:1/-1;grid-row:2;aspect-ratio:auto;max-height:none;min-height:0;width:100%;height:100%;border-radius:16px}
          body.scanning #video{object-fit:cover}
          body.scanning #privacy{font-size:10px;padding:5px 9px;bottom:8px}
          body.scanning .result{grid-column:1/-1;grid-row:3;padding:10px 14px;border-radius:14px;max-height:27svh;overflow:auto}
          body.scanning .result .eyebrow{margin:0;font-size:9px}
          body.scanning .result h2{font-size:20px;margin:4px 0;line-height:1.2}
          body.scanning .result h3{font-size:16px;margin:4px 0}
          body.scanning #advice{font-size:12px;margin:4px 0;line-height:1.35}
          body.scanning #stop,body.scanning #start{grid-column:1;grid-row:4;margin:0;padding:8px;font-size:13px}
          body.scanning .choose{grid-column:2;grid-row:4;margin:0;padding:12px 4px;font-size:12px}
          body.scanning #status{grid-column:1/-1;grid-row:5;margin:0;font-size:10px;min-height:0}
          '''
          p.write_text(css)
          p=Path('web/app.js');s=p.read_text()
          if '// Mobile scanning behaviour' not in s:
           s=s.replace('function render(){', "// Mobile scanning behaviour\nfunction render(){\n document.body.classList.toggle('scanning',!!source);")
           marker=" $('notice').textContent="
           addition=""" if(item && manifest.mode==='trained'){
            const prompt=config.classes[item.cls]?.prompt||'';
            if(/bottle/i.test(prompt)){
             $('name').textContent=lang==='de'?'Flasche – Material unklar':'Bottle – material uncertain';
             $('destination').textContent='';
             $('advice').textContent=lang==='de'?'Kunststoff oder Glas? Bitte am Gegenstand prüfen. Aus diesem Bild lässt sich das Material nicht sicher bestimmen.':'Plastic or glass? Please check the item. This image does not establish its material reliably.';
            }else if(mode==='camera' && count<2){
             $('name').textContent=(lang==='de'?'Möglicherweise: ':'Possible: ')+$('name').textContent;
             $('destination').textContent='';
             $('advice').textContent=lang==='de'?'Erkennung wird bestätigt …':'Confirming recognition …';
            }
           }
          """
           assert marker in s;s=s.replace(marker,addition+marker)
           old="const s=Math.min(r.width/w,r.height/h),dx="
           new="const s=(mode==='camera'?Math.max:Math.min)(r.width/w,r.height/h),dx="
           assert old in s;s=s.replace(old,new)
           old="if(count>=3||mode==='photo')item=b;"
           assert old in s;s=s.replace(old,"item=b;")
          p.write_text(s)
      - name: Stamp visible app version and refresh asset URLs
        shell: python
        run: |
          from pathlib import Path
          import os, json, re
          from datetime import datetime, timezone
          version='0.5.0'
          run=os.environ.get('GITHUB_RUN_NUMBER','local')
          attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')
          commit=os.environ.get('GITHUB_SHA','local')[:7]
          build=f'{run}.{attempt}-{commit}'
          stamp=f'{version}-{build}'
          info={'version':version,'build':build,'builtAt':datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}
          p=Path('web/index.html');s=p.read_text()
          s=re.sub(r'<p id="versionDisclaimer"[^>]*>.*?</p>', '', s, flags=re.S)
          s=s.replace('</main>', '<p id="versionDisclaimer" aria-label="App version"></p></main>')
          s=re.sub(r'href="style\.css(?:\?[^"]*)?"',f'href="style.css?v={stamp}"',s)
          s=re.sub(r'src="app\.js(?:\?[^"]*)?"',f'src="app.js?v={stamp}"',s)
          p.write_text(s)
          p=Path('web/app.js');s=p.read_text()
          s=re.sub(r'// Build identification start\n.*?// Build identification end\n','',s,flags=re.S)
          addition="// Build identification start\nconst APP_BUILD="+json.dumps(info)+";\n"+r"""function renderVersion(){
           const size=manifest?.inputSize;
           const modelInfo=size ? `YOLOv8n · ${size}×${size}` : (lang==='de'?'Modell noch nicht geladen':'Model not loaded yet');
           $('versionDisclaimer').textContent=`v${APP_BUILD.version} · Build ${APP_BUILD.build} · ${modelInfo}\n${APP_BUILD.builtAt}\n`+(lang==='de'?'Experimenteller Prototyp – Material und Sortierempfehlung können falsch sein.':'Experimental prototype – material and sorting advice may be incorrect.');
           diagnostics.appVersion=APP_BUILD.version;diagnostics.appBuild=APP_BUILD.build;
          }
          // Build identification end
          """
          s=s.replace('function render(){',addition+'function render(){',1)
          s=s.replace('function render(){\n renderVersion();','function render(){')
          s=s.replace('function render(){','function render(){\n renderVersion();',1)
          p.write_text(s)
          p=Path('web/style.css');s=p.read_text().split('/* Build identification */')[0]
          s+="""/* Build identification */
          #versionDisclaimer{font-size:10px;line-height:1.35;color:#526558;text-align:center;white-space:pre-line;overflow-wrap:anywhere;margin:12px 0 0}
          body.scanning main{grid-template-rows:42px minmax(100px,1fr) auto 48px auto auto}
          body.scanning #versionDisclaimer{display:block;grid-column:1/-1;grid-row:6;margin:0;font-size:9px}
          """
          p.write_text(s)
      - name: Install single-screen iPhone layout
        shell: python
        run: |
          CSS='/* SPDX-License-Identifier: AGPL-3.0-or-later */\n:root{font-family:system-ui,-apple-system,sans-serif;color:#173f32;background:#f6f7f1}*{box-sizing:border-box}body{margin:0}main{height:100vh;height:100svh;height:100dvh;max-width:700px;margin:auto;padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr 1fr;grid-template-rows:44px minmax(0,1fr) auto 44px auto auto;gap:6px}header{grid-area:1/1/2/-1;display:flex;align-items:center;gap:8px;min-width:0}header b{font-size:11px;letter-spacing:.4px;margin-right:auto}button{font:inherit;min-height:44px;cursor:pointer;border:0;border-radius:10px}#language,#infoButton{background:#e1e9db;color:#173f32;padding:0 10px;min-width:44px}#eyebrow,#heading,#intro,#notice{display:none}#camera{grid-area:2/1/3/-1;position:relative;min-height:0;overflow:hidden;border-radius:16px;background:#e2e9dc;display:grid;place-items:center}video,img,canvas{position:absolute;inset:0;width:100%;height:100%}video{object-fit:cover;background:#15281e}img{object-fit:contain;background:#15281e}canvas{pointer-events:none}#placeholder{font-size:64px;color:#8da48e}#privacy{position:absolute;bottom:8px;max-width:95%;background:#f6faefe8;border-radius:24px;padding:5px 9px;font-size:10px;text-align:center}.result{grid-area:3/1/4/-1;padding:9px 12px;border:1px solid #dce5d6;background:white;border-radius:14px;min-width:0}.result .eyebrow{display:none}.result h2{font-size:20px;line-height:1.15;margin:0;overflow-wrap:anywhere}.result h3{font-size:15px;line-height:1.2;margin:5px 0 0;color:#39734e}#advice{font-size:12px;line-height:1.3;margin:5px 0 0;color:#526558}#destination:empty,#advice:empty{display:none}.primary{grid-area:4/1/5/2;width:100%;padding:6px;background:#173f32;color:white;font-size:14px;font-weight:650}button:disabled{opacity:.5}.choose{grid-area:4/2/5/3;display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;border-radius:10px;background:#e1e9db;text-align:center;cursor:pointer}.choose input{position:absolute;width:1px;height:1px;clip-path:inset(50%)}#status{grid-area:5/1/6/-1;margin:0;text-align:center;font-size:11px;line-height:1.2;color:#526558;overflow-wrap:anywhere}#status.error{color:#a43b2a}#versionDisclaimer{grid-area:6/1/7/-1;margin:0;font-size:9px;line-height:1.25;color:#526558;text-align:center;white-space:pre-line;overflow-wrap:anywhere}dialog{max-width:min(94vw,600px);max-height:85dvh;overflow:auto;border:1px solid #dce5d6;border-radius:16px;padding:16px;color:#173f32;background:#f6f7f1}dialog::backdrop{background:#15281e99}dialog footer{font-size:14px;line-height:1.5}dialog button{padding:8px 16px}a{color:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}[hidden]{display:none!important}:focus-visible{outline:3px solid #8abd79;outline-offset:2px}\n@media(max-height:560px){main{gap:4px}.result{padding:7px 10px}.result h2{font-size:18px}#advice{font-size:11px}#privacy{font-size:9px;padding:4px 8px}}\n/* Preserve access with text zoom or very short landscape windows. */\n@media(max-height:420px){main{height:auto;min-height:100dvh;grid-template-rows:44px minmax(140px,1fr) auto 44px auto auto}}\n'
          from pathlib import Path
          import re
          p=Path('web/style.css');p.write_text(CSS)
          p=Path('web/index.html');s=p.read_text()
          if 'id="infoDialog"' not in s:
           footer=re.search(r'<footer>.*?</footer>',s,re.S).group()
           s=s.replace(footer,'').replace('</main>', '</main><dialog id="infoDialog"><button id="closeInfo" type="button">Schließen / Close</button>'+footer+'</dialog>')
           s=s.replace('<button id="language"','<button id="infoButton" type="button" aria-label="Information">Info</button><button id="language"')
          p.write_text(s)
          p=Path('web/app.js');s=p.read_text()
          s=s.replace("$('versionDisclaimer').textContent=", "$('versionDisclaimer').title=APP_BUILD.builtAt;\n $('versionDisclaimer').textContent=",1) if "$('versionDisclaimer').title=" not in s else s
          s=s.replace('${modelInfo}\\n${APP_BUILD.builtAt}\\n','${modelInfo}\\n')
          s=s.replace('Experimenteller Prototyp – Material und Sortierempfehlung können falsch sein.','Prototyp · Material und Sortierhinweise können falsch sein.').replace('Experimental prototype – material and sorting advice may be incorrect.','Prototype · Material and sorting advice may be incorrect.')
          s=s.replace("chooseText:'Oder ein Foto auswählen'", "chooseText:'Foto wählen'").replace("chooseText:'Or choose a photo'", "chooseText:'Choose photo'")
          s=s.replace('Kunststoff oder Glas? Bitte am Gegenstand prüfen. Aus diesem Bild lässt sich das Material nicht sicher bestimmen.','Kunststoff oder Glas? Bitte am Gegenstand prüfen.').replace('Plastic or glass? Please check the item. This image does not establish its material reliably.','Plastic or glass? Please check the item.')
          if '// Information dialog' not in s:
           s+="\n// Information dialog\n$('infoButton').onclick=()=>$('infoDialog').showModal();\n$('closeInfo').onclick=()=>$('infoDialog').close();\n"
          p.write_text(s)
      - name: Configure trained classes and advice
        shell: python
        run: |
          from pathlib import Path
          import json
          assert Path('models/waste_yolov8n.pt').is_file(), 'Commit models/waste_yolov8n.pt first'
          Path('web/config.json').write_text(json.dumps({'confidence': 0.25, 'classes': [{'prompt': 'Papier', 'de': 'Papier', 'en': 'Paper', 'bin': 'paper'}, {'prompt': 'Leichtverpackung', 'de': 'Leichtverpackung', 'en': 'Lightweight packaging', 'bin': 'yellow'}, {'prompt': 'Buntglas', 'de': 'Buntglas', 'en': 'Coloured glass', 'bin': 'colored'}, {'prompt': 'Weißglas', 'de': 'Weißglas', 'en': 'Clear glass', 'bin': 'clear'}, {'prompt': 'Biotonne', 'de': 'Biotonne', 'en': 'Organic waste', 'bin': 'bio'}, {'prompt': 'Restmüll', 'de': 'Restmüll', 'en': 'Residual waste', 'bin': 'residual'}]},ensure_ascii=False,indent=2),encoding='utf-8')
          p=Path('web/app.js');s=p.read_text()
          s=s.replace("'world'", "'trained'").replace('world:', 'trained:').replace('YOLO-World v2', 'YOLOv8n')
          if 'residual:{' not in s:
              s=s.replace('const bins={', "const bins={\n residual:{de:['Restmüll','Nur nicht verwertbarer Haushaltsabfall. Keine Batterien, Elektrogeräte oder Problemstoffe.'],en:['Residual waste','Non-recyclable household waste only. No batteries, electronics or hazardous waste.']},")
          p.write_text(s)
      - name: Match bounding box colours to predictions
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('web/app.js');s=p.read_text()
          # Use the predicted class's collection stream, independent of UI language.
          colour="({paper:'#ff0000',yellow:'#ffff00',colored:'#008000',clear:'#ffffff',bio:'#a52a2a',residual:'#000000'}[config.classes[b.cls]?.bin] || '#808080')"
          start=s.index('function draw(')
          end=s.index('async function tick(',start)
          draw=s[start:end]
          draw,n=re.subn(r"ctx\.strokeStyle\s*=.*?;",lambda _: 'ctx.strokeStyle='+colour+';',draw)
          assert n==1, f'Expected one bounding-box stroke colour, found {n}'
          s=s[:start]+draw+s[end:]
          p.write_text(s)
      - name: Check source code
        run: |
          node --check web/app.js
          node --check scripts/browser_test.mjs
          python -m py_compile scripts/export_model.py scripts/classroom_input.py
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: build/models
          key: trained-classroom-640-v1-${{ hashFiles('models/waste_yolov8n.pt', 'scripts/export_model.py', 'scripts/classroom_input.py', 'scripts/requirements.txt', 'web/config.json') }}
      - name: Install export tools
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements.txt
      - name: Export and numerically verify trained YOLOv8n
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/export_model.py --choice trained
      - name: Package site
        run: |
          mkdir -p site/models
          cp web/index.html web/app.js web/style.css web/config.json site/
          cp build/models/waste_640.tflite build/models/manifest.json build/models/validation.json site/models/
          touch site/.nojekyll
      - name: Install browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Require trained-model inference on both browser paths
        timeout-minutes: 10
        run: node scripts/browser_test.mjs
      - name: Save verified changes in CV-Waste-Everywhere
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/config.json web/app.js web/index.html web/style.css scripts/browser_test.mjs scripts/export_model.py scripts/classroom_input.py scripts/requirements.txt README-WASTE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Use classroom inference API with YOLOv8n TFLite'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trained-validation
          path: |
            model-work/*.log
            site/models/*.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
