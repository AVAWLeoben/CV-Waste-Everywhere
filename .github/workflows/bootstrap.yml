ontext(`gpuChecks=0;cpuOnly=false;gpuDevice.popErrorScope=async()=>null;gpuFault=\'\';\nmodel={device:\'webgpu\',predict:async()=>({boxes:[{cls:1,conf:.8,x1:20,y1:30,x2:180,y2:300}]}),free(){}};`,scope);\nassert.deepEqual(await vm.runInContext(\'predictWithFallback(frame,{})\',scope),good);\nassert.equal(vm.runInContext(\'model.device\',scope),\'cpu\');\n// The exact padding signature is rejected, but confidence 114/255 alone is legal.\nscope.padding={boxes:[{cls:0,conf:114/255,x1:6.117645263671875,y1:286.1176452636719,x2:578.3529052734375,y2:858.3529052734375}]};\nassert.equal(vm.runInContext(\'paddingOutput(padding,720,1280)\',scope),true);\nassert.equal(vm.runInContext(\'paddingOutput({boxes:[{...good.boxes[0],conf:114/255}]},720,1280)\',scope),false);\nvm.runInContext("cpuOnly=false;gpuChecks=2;model={device:\'webgpu\',predict:async()=>padding,free(){}}",scope);\nassert.deepEqual(await vm.runInContext(\'predictWithFallback(frame,{})\',scope),good);\nassert.match(vm.runInContext(\'diagnostics.gpuError\',scope),/padding/);\nconsole.log(\'PASS: two CPU comparisons, GPU-only after verification, later validation failure, silent mismatch and padding fallback\');\nvm.runInContext(`globalThis.GPUDevice=class {createShaderModule(d){return {getCompilationInfo:async()=>({messages:[{type:\'error\',message:\'Not a valid statement\',lineNum:2,linePos:1}]})}}};installShaderDiagnostics();new GPUDevice().createShaderModule({label:\'test\',code:\'loop {\\\\n;\\\\ncontinuing {}\\\\n}\'});`,scope);\nawait vm.runInContext(\'collectShaderDiagnostics()\',scope);\nassert.equal(vm.runInContext(\'diagnostics.shaderCapture\',scope),\'enabled\');\nassert.match(vm.runInContext(\'diagnostics.shaderErrors[0].messages[0].source\',scope),/2: continuing/);\nassert.equal(vm.runInContext(\'diagnostics.shaderErrors[0].messages[0].message\',scope),\'Not a valid statement\');\nconsole.log(\'PASS: shader compiler message, line number and source excerpt capture\');\n\nassert.equal(vm.runInContext("compatibleShader(\'loop {\\\\n  ;\\\\n  continuing {\\\\n i++;\\\\n }\\\\n}\')",scope),\'loop {\\n  continuing {\\n i++;\\n }\\n}\');\nfor(const code of [\'i++;\\ncontinuing {\',\'for(var i=0;i<4;i++){\',\';\\nlet x=1;\',\'// ;\\ncontinuing {\']){\n scope.shaderSample=code;assert.equal(vm.runInContext(\'compatibleShader(shaderSample)\',scope),code);\n}\nassert.equal(vm.runInContext(\'diagnostics.shadersPatched\',scope),1);\nconsole.log(\'PASS: targeted shader repair preserves loop increments and other statements\');\n', encoding='utf-8')
          Path('scripts/capture_test.mjs').write_text("import {chromium} from 'playwright';\nimport assert from 'node:assert/strict';\nimport {spawn} from 'node:child_process';\nconst server=spawn('python3',['-m','http.server','8011','--bind','127.0.0.1'],{stdio:'ignore'});\nlet browser;\ntry{\n for(let i=0;i<40;i++){try{if((await fetch('http://127.0.0.1:8011/web/')).ok)break;}catch{}await new Promise(r=>setTimeout(r,100));}\n browser=await chromium.launch({headless:true});\n for(const viewport of [{width:390,height:664},{width:375,height:548},{width:844,height:390}]){\n const page=await browser.newPage({viewport});const errors=[];page.on('pageerror',e=>errors.push(e.message));\n await page.route('**/models/manifest.json',route=>route.fulfill({json:{pipeline:'classroom',mode:'trained',model:'yolo11s.pt',file:'mock.tflite',inputSize:640,prompts:['Papier','Leichtverpackung','Buntglas','Weißglas','Biotonne','Restmüll']}}));\n await page.route('**/mock.tflite',route=>route.fulfill({body:'mock'}));\n await page.route('https://esm.sh/**',route=>route.fulfill({contentType:'application/javascript',body:`export const YOLO={load:async()=>({device:'cpu',predict:async(src)=>{window.calls=(window.calls||0)+1;window.inputType=src.tagName;await new Promise(r=>setTimeout(r,120));if(window.failNext){window.failNext=false;throw Error('Simulated failure')}return {width:src.width,height:src.height,boxes:[{cls:0,name:'Papier',conf:.9,x1:10,y1:10,x2:200,y2:300}]}},free(){}})};`}));\n await page.addInitScript(()=>{Object.defineProperty(navigator,'mediaDevices',{value:{getUserMedia:async()=>{const c=document.createElement('canvas');c.width=480;c.height=640;const g=c.getContext('2d');g.fillStyle='gray';g.fillRect(0,0,480,640);return c.captureStream(15);}}});});\n await page.goto('http://127.0.0.1:8011/web/');await page.locator('#start').click();\n await page.waitForFunction(()=>document.querySelector('#classify').hidden===false);\n await page.waitForFunction(()=>!document.querySelector('#classify').disabled);\n assert.equal(await page.evaluate(()=>window.calls||0),0);\n const initial=await page.locator('#video').boundingBox();\n const frame=await page.locator('#camera').boundingBox();\n assert(Math.abs(initial.height-frame.height)<1 || Math.abs(initial.width-frame.width)<1,'Preview does not fill either frame dimension');\n assert(await page.locator('#reticle').isVisible());\n for(let n=1;n<=3;n++){\n  await page.locator('#classify').click();\n  await page.waitForFunction(()=>document.body.dataset.phase==='result');\n  assert.equal(await page.evaluate(()=>window.calls),n);\n  assert.equal(await page.evaluate(()=>window.inputType),'CANVAS');\n  assert(await page.locator('#capture').isVisible());\n  assert.equal(await page.locator('#video').evaluate(e=>e.hidden),false);\n  assert.equal(await page.locator('#name').textContent(),'Papier');\n  await page.waitForTimeout(200);assert.equal(await page.evaluate(()=>window.calls),n);\n  if(n===1)await page.screenshot({path:`capture-${viewport.width}.png`});\n  await page.locator('#continue').click();assert(await page.locator('#video').isVisible());\n  const current=await page.locator('#video').boundingBox();\n  assert.deepEqual(current,initial,'Continue changed the displayed video size');\n }\n await page.evaluate(()=>window.failNext=true);await page.locator('#classify').click();\n await page.waitForFunction(()=>document.body.dataset.phase==='error');\n await page.locator('#continue').click();await page.locator('#classify').click();\n await page.waitForFunction(()=>document.body.dataset.phase==='result');assert.equal(await page.evaluate(()=>window.calls),5);\n assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);\n assert.deepEqual(errors,[]);\n await page.close();\n }\n console.log('PASS: three viewports, no automatic inference, repeated full-frame capture, frozen result, Continue, error recovery');\n}finally{await browser?.close();server.kill();}\n", encoding='utf-8')
      - name: Stamp visible app version and refresh asset URLs
        shell: python
        run: |
          from pathlib import Path
          import os, json, re
          from datetime import datetime, timezone
          version='0.7.2'
          run=os.environ.get('GITHUB_RUN_NUMBER','local')
          attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')
          commit=os.environ.get('GITHUB_SHA','local')[:7]
          build=f'{run}.{attempt}-{commit}'
          stamp=f'{version}-{build}'
          info={'version':version,'build':build,'builtAt':datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}
          p=Path('web/index.html');s=p.read_text()
          s=re.sub(r'<p id="versionDisclaimer"[^>]*>.*?</p>', '', s, flags=re.S)
          s=s.replace('</dialog>', '<p id="versionDisclaimer" aria-label="App version"></p></dialog>')
          s=re.sub(r'href="style\.css(?:\?[^"]*)?"',f'href="style.css?v={stamp}"',s)
          s=re.sub(r'src="app\.js(?:\?[^"]*)?"',f'src="app.js?v={stamp}"',s)
          p.write_text(s)
          p=Path('web/app.js');s=p.read_text()
          s=re.sub(r'// Build identification start\n.*?// Build identification end\n','',s,flags=re.S)
          addition="// Build identification start\nconst APP_BUILD="+json.dumps(info)+";\n"+r"""function renderVersion(){
           const size=manifest?.inputSize;
           const modelInfo=size ? `${manifest.architecture || "YOLO detector"} · ${manifest.model} · ${size}×${size}${manifest.end2end ? " · End-to-end" : ""}` : (lang==='de'?'Modell noch nicht geladen':'Model not loaded yet');
           $('versionDisclaimer').textContent=`v${APP_BUILD.version} · Build ${APP_BUILD.build} · ${modelInfo}\n${APP_BUILD.builtAt}\n`+(lang==='de'?'Experimenteller Prototyp – Material und Sortierempfehlung können falsch sein.':'Experimental prototype – material and sorting advice may be incorrect.');
           diagnostics.appVersion=APP_BUILD.version;diagnostics.appBuild=APP_BUILD.build;
          }
          // Build identification end
          """
          s=s.replace('function render(){',addition+'function render(){',1)
          s=s.replace('function render(){\n renderVersion();','function render(){')
          s=s.replace('function render(){','function render(){\n renderVersion();',1)
          p.write_text(s)
      - name: Configure trained classes and advice
        shell: python
        run: |
          from pathlib import Path
          import json
          import os
          assert Path(os.environ['MODEL_PATH']).is_file(), 'Selected checkpoint is missing'
          Path('web/config.json').write_text(json.dumps({'confidence': 0.25, 'classes': [{'prompt': 'Papier', 'de': 'Papier', 'en': 'Paper', 'bin': 'paper'}, {'prompt': 'Leichtverpackung', 'de': 'Leichtverpackung', 'en': 'Lightweight packaging', 'bin': 'yellow'}, {'prompt': 'Buntglas', 'de': 'Buntglas', 'en': 'Coloured glass', 'bin': 'colored'}, {'prompt': 'Weißglas', 'de': 'Weißglas', 'en': 'Clear glass', 'bin': 'clear'}, {'prompt': 'Biotonne', 'de': 'Biotonne', 'en': 'Organic waste', 'bin': 'bio'}, {'prompt': 'Restmüll', 'de': 'Restmüll', 'en': 'Residual waste', 'bin': 'residual'}]},ensure_ascii=False,indent=2),encoding='utf-8')
          p=Path('web/app.js');s=p.read_text()
          s=s.replace("'world'", "'trained'").replace('world:', 'trained:').replace('YOLO-World v2', 'YOLOv8n')
          if 'residual:{' not in s:
              s=s.replace('const bins={', "const bins={\n residual:{de:['Restmüll','Nur nicht verwertbarer Haushaltsabfall. Keine Batterien, Elektrogeräte oder Problemstoffe.'],en:['Residual waste','Non-recyclable household waste only. No batteries, electronics or hazardous waste.']},")
          p.write_text(s)
      - name: Check source code
        run: |
          node scripts/capture_state_test.mjs
          node --check web/app.js
          node --check scripts/browser_test.mjs
          python -m py_compile scripts/export_model.py scripts/classroom_input.py
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: build/models
          key: trained-classroom-640-e2e-v4-${{ env.MODEL_PATH }}-${{ env.MODEL_SHA256 }}-${{ hashFiles( 'scripts/export_model.py', 'scripts/classroom_input.py', 'scripts/requirements.txt', 'web/config.json') }}
      - name: Install export tools
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements.txt
      - name: Export and numerically verify trained YOLO
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/export_model.py --choice trained
      - name: Package site
        run: |
          mkdir -p site/models
          cp web/index.html web/app.js web/style.css web/config.json site/
          cp build/models/waste_640.tflite build/models/manifest.json build/models/validation.json site/models/
          touch site/.nojekyll
      - name: Install browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Require trained-model inference on both browser paths
        timeout-minutes: 20
        run: |
          node scripts/capture_test.mjs
          node scripts/browser_test.mjs
      - name: Save verified changes in CV-Waste-Everywhere
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/capture_state_test.mjs scripts/capture_test.mjs web/config.json web/app.js web/index.html web/style.css scripts/browser_test.mjs scripts/export_model.py scripts/classroom_input.py scripts/requirements.txt README-WASTE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Use explicit capture and Continue inference flow'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trained-validation
          path: |
            model-work/*.log
            site/models/*.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
